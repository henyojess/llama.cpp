name: Build Windows CUDA (all FA quants)

on:
  workflow_dispatch:

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set artifact name
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmm')
          $sha  = $env:GITHUB_SHA.Substring(0, 7)
          "ARTIFACT_NAME=llama-win-cuda12.8-sm120-fa-all-quants-$date-$sha" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: 'local'

      - name: Configure
        run: >
          cmake -B build
          -DGGML_CUDA=ON
          -DGGML_CUDA_FA_ALL_QUANTS=ON
          -DCMAKE_CUDA_ARCHITECTURES=120
          -DLLAMA_CURL=OFF
          -DLLAMA_BUILD_TESTS=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Build
        run: >
          cmake --build build --config Release -j 4
          --target llama-server llama-cli llama-bench llama-quantize

      - name: Copy CUDA runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll" build\bin\Release\
          Copy-Item "$env:CUDA_PATH\bin\cublas64_12.dll" build\bin\Release\
          Copy-Item "$env:CUDA_PATH\bin\cublasLt64_12.dll" build\bin\Release\

      - name: Copy OpenSSL DLLs
        shell: pwsh
        run: |
          $inc = (Select-String build\CMakeCache.txt -Pattern '^OPENSSL_INCLUDE_DIR:PATH=(.*)$').Matches[0].Groups[1].Value
          if (-not $inc) { throw "OpenSSL not recorded in CMakeCache.txt" }
          $root = Split-Path $inc
          Write-Host "OpenSSL root: $root"
          $dlls = Get-ChildItem $root -Recurse -Include libssl-3-x64.dll, libcrypto-3-x64.dll |
            Sort-Object Name -Unique
          if ($dlls.Count -ne 2) { throw "Expected 2 OpenSSL DLLs, found $($dlls.Count)" }
          $dlls | ForEach-Object { Write-Host "Copying $($_.FullName)" }
          $dlls | Copy-Item -Destination build\bin\Release\

      - name: List output
        shell: pwsh
        run: Get-ChildItem build\bin\Release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/bin/Release/
